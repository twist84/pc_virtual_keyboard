# Quick Launch / Game Library
# path = full path to the game executable
# args = optional command-line arguments
# type = disc | arcade | indie | demo | installed
# working_dir = optional (defaults to path's folder)
# icon = optional path to .ico (otherwise extracted from path)
#
# Edit path= for each entry to point at your installs.
# Entries with a missing or invalid path show "Failed to launch" when selected.

